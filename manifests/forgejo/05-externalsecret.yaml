apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-username
      remoteRef:
        key: forgejo
        property: admin-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: forgejo
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-email
      remoteRef:
        key: forgejo
        property: admin-email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
