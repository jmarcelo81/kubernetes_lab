apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: music
  labels:
    app.kubernetes.io/name: navidrome
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube002
      securityContext:
        fsGroup: 1000
      containers:
        - name: navidrome
          image: deluan/navidrome:0.58.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4533
              protocol: TCP
          env:
            - name: ND_LOGLEVEL
              value: "info"
            - name: ND_SESSIONTIMEOUT
              value: "24h"
            - name: ND_BASEURL
              value: ""
            - name: ND_ENABLETRANSCODINGCONFIG
              value: "true"
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_SCANSCHEDULE
              value: "@every 15m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: music-library
