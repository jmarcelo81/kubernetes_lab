apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: jenkins-admin
    creationPolicy: Owner
  data:
    - secretKey: jenkins-admin-user
      remoteRef:
        key: secret/jenkins/admin
        property: username
    - secretKey: jenkins-admin-password
      remoteRef:
        key: secret/jenkins/admin
        property: password
