apiVersion: external-secrets.io/v1beta1   # match 11-externalsecret-github.yaml
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: jenkins-admin
    creationPolicy: Owner
  data:
    - secretKey: jenkins-admin-user
      remoteRef: { key: jenkins/admin, property: username }
    - secretKey: jenkins-admin-password
      remoteRef: { key: jenkins/admin, property: password }
